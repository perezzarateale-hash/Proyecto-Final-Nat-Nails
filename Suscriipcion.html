<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Tu Nombre Completo">
    <title>Nat-Nails | Suscripción</title>
    <link rel="icon" type="image/jpeg" href="Imagenes y logo/naT nails.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        :root {
            --rosa-principal: #e85d9a;
            --rosa-oscuro: #c23b78;
            --rosa-fondo: #fff5f9;
            --dorado: #d4af37;
            --dorado-claro: #f3dfb0;
        }

        body {
            background: linear-gradient(135deg, var(--rosa-fondo) 0%, #fffaf0 100%);
            color: #3a252e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .tarjeta-natnails {
            background-color: #ffffff;
            border: 2px solid var(--dorado);
            border-radius: 18px;
            box-shadow: 0 10px 28px rgba(212, 175, 55, 0.18);
        }

        .titulo-dorado {
            color: var(--rosa-oscuro);
            font-weight: 700;
            border-bottom: 2px solid var(--dorado-claro);
            padding-bottom: 10px;
        }

        .form-label {
            color: var(--rosa-oscuro);
            font-weight: 600;
        }

        .form-control, .form-select {
            border: 1.5px solid #f2c6d9;
            border-radius: 10px;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--dorado);
            box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.25);
        }

        .form-check-input:checked {
            background-color: var(--rosa-principal);
            border-color: var(--dorado);
        }

        .btn-salon {
            background: linear-gradient(90deg, var(--rosa-principal), var(--dorado));
            color: #ffffff;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-salon:hover {
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(212, 175, 55, 0.35);
        }

        footer {
            background-color: #fff0f6;
            border-top: 2px solid var(--dorado);
            color: var(--rosa-oscuro);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="Imagenes y logo/naT nails.jpg" alt="Logo Nat-Nails" width="36" height="36" class="rounded-circle" style="object-fit: cover; border: 1.5px solid #d4af37;">
                <span>Nat-Nails</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <!-- Componente Dropdown -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            Servicios
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="servicios-uñas.html">Aplicación de Uñas</a></li>
                            <li><a class="dropdown-item" href="planchado-express.html">Planchado Express</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="Acerca_de.html">Acerca de</a></li>
                    <li class="nav-item"><a class="nav-link" href="Contacto.html">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link" href="Suscriipcion.html">Suscripción</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card tarjeta-natnails p-4">
                    <h3 class="text-center mb-3 titulo-dorado"> Promociones y Descuentos </h3>
                    <p class="text-muted text-center">Recibe notificaciones en cada promoción por cada día festivo del año.</p>

                    <form id="formSuscripcion">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Ej. Fernanda Pérez" required>
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label">Número personal</label>
                            <input type="tel" class="form-control" id="telefono" placeholder="Ej. 8991234567" pattern="[0-9]{10}" maxlength="10" title="Ingresa un número de 10 dígitos" required>
                            <div class="form-text"></div>
                        </div>

                        <div class="mb-3">
                            <label for="interes" class="form-label">Servicio de mayor interés</label>
                            <select class="form-select" id="interes" name="interes">
                                <option value="unas">Aplicación de Uñas</option>
                                <option value="planchado">Planchado Express</option>
                                <option value="unas_manos_pies">Aplicación de uñas en manos y pies</option>
                                <option value="manicura_planchado">Servicio de manicura y planchado</option>
                                <option value="otros">Otros servicios</option>
                            </select>
                        </div>

                        <!-- Campo oculto que se muestra al elegir "Otros servicios" -->
                        <div class="mb-3 d-none" id="contenedorOtroServicio">
                            <label for="otroServicio" class="form-label">¿Qué otro servicio te gustaría?</label>
                            <input type="text" class="form-control" id="otroServicio" name="otroServicio" placeholder="Escribe aquí el servicio que buscas...">
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="acepto" required>
                            <label class="form-check-label" for="acepto">
                                Acepto recibir notificaciones y promociones.
                            </label>
                        </div>

                        <button type="submit" class="btn btn-salon w-100">Suscribirme ahora</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2026 Nat-Nails. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const selectInteres = document.getElementById('interes');
        const contenedorOtro = document.getElementById('contenedorOtroServicio');
        const inputOtro = document.getElementById('otroServicio');

        function actualizarCampoOtro() {
            if (selectInteres.value === 'otros') {
                contenedorOtro.classList.remove('d-none');
                inputOtro.required = true;
            } else {
                contenedorOtro.classList.add('d-none');
                inputOtro.required = false;
                inputOtro.value = '';
            }
        }

        selectInteres.addEventListener('change', actualizarCampoOtro);
        actualizarCampoOtro();
    </script>
</body>
</html>
